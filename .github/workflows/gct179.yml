name: gct179
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'gen | iso | mix'
        default: 'mix'
      d:
        description: 'subspace dimension'
        default: '7'
      secs:
        description: 'search seconds per process'
        default: '12600'
      tag:
        description: 'result tag'
        default: 'a'
      pushint:
        description: 'seconds between interim pushes'
        default: '1200'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Search
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          pip install numpy
          git config user.name lapseR8
          git config user.email 269838972+lapseR8@users.noreply.github.com
          N=$(nproc); echo "cores $N"
          OUT=results/gct179_${{ inputs.tag }}_${{ inputs.mode }}_d${{ inputs.d }}_${{ github.run_id }}
          mkdir -p results
          push() {
            cat $OUT.p*.txt > $OUT.txt 2>/dev/null || true
            git add $OUT.txt
            git commit -q -m "gct179 results ${{ inputs.tag }} ${{ github.run_id }}" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" || true
            for k in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 7; done
          }
          pids=""
          for p in $(seq 1 $N); do
            SEED=$(( ${{ github.run_id }} % 100000 * 10 + p ))
            case "${{ inputs.mode }}" in
              ext6) CMD="python ext6.py ${{ inputs.d }} $SEED ${{ inputs.secs }} ../$OUT.p$p.txt" ;;
              sym) CMD="python sym.py ${{ inputs.d }} $SEED ${{ inputs.secs }} ../$OUT.p$p.txt" ;;
              *) CMD="python cloud.py ${{ inputs.mode }} ${{ inputs.d }} $SEED ${{ inputs.secs }} ../$OUT.p$p.txt" ;;
            esac
            (cd gct179 && $CMD) &
            pids="$pids $!"
          done
          ( while true; do sleep ${{ inputs.pushint }}; push; done ) &
          PP=$!
          wait $pids
          kill $PP 2>/dev/null || true
          push
