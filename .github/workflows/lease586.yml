name: lease-586
on: workflow_dispatch
jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Renew the L-meta-586 lease every 10 minutes
        env:
          LEASE: ${{ secrets.LEASE_586 }}
        run: |
          for i in $(seq 1 34); do
            c=$(curl -s -o /dev/null -w '%{http_code}' -X POST "https://pequalnp.com/desk/beat?lease=$LEASE")
            echo "$(date -u +%H:%M) beat $c"
            if [ "$c" = 410 ]; then echo "lease ended (410)"; break; fi
            sleep 600
          done
